# Конфигурационный файл Telegram Server Bot

# Конфигурация бота
bot:
  # Токен Telegram бота (обязательный параметр)
  token: "7725781489:AAGrXfPzK1qX8yQ1yQ1yQ1yQ1yQ1yQ1yQ1yQ"  # Замените на ваш токен
  
  # Список ID чатов, которым разрешено использовать бота (обязательный параметр)
  allowed_chats: 
    - 111114111  # Замените на ваш ID чата
  
  # Таймаут обновлений в секундах (по умолчанию: 60)
  update_timeout: 60

# Конфигурация мониторинга системы
monitoring:
  # Интервал проверки системных метрик в секундах (по умолчанию: 30)
  check_interval: 30
  
  # Пороговое значение CPU в процентах для отправки уведомлений (по умолчанию: 90)
  cpu_threshold: 90
  
  # Пороговое значение использования памяти в процентах для отправки уведомлений (по умолчанию: 85)
  memory_threshold: 85
  
  # Пороговое значение использования диска в процентах для отправки уведомлений (по умолчанию: 10)
  disk_threshold: 10

# Конфигурация Docker
docker:
  # Путь к Docker socket (по умолчанию: "/var/run/docker.sock")
  socket: "/var/run/docker.sock"
  
  # Таймаут выполнения Docker команд в секундах (по умолчанию: 10)
  timeout: 10
  
  # Путь к бинарному файлу docker (по умолчанию: "docker")
  bin: "docker"
  
  # Префикс для Docker команд, например ["sudo"] (по умолчанию: ["sudo"])
  command_prefix: ["sudo"]
  
  # Директория для временных операций (по умолчанию: "/tmp")
  tmp_dir: "/tmp"
  
  # Путь внутри контейнера, где находятся файлы awg (по умолчанию: "/opt/amnezia/awg")
  wg_path: "/opt/amnezia/awg"

# Конфигурация выполнения внешних команд
cmdrunner:
  # Таймаут выполнения команд в секундах (по умолчанию: 10)
  timeout_seconds: 10
  
  # Количество попыток выполнения команды (по умолчанию: 3)
  attempts: 3
  
  # Пароль sudo для выполнения команд (по умолчанию: "")
  sudo_password: ""

# Конфигурация worker pool
workerpool:
  # Количество worker'ов в пуле (по умолчанию: 5)
  workers_count: 5
